<main class="container my-4">
  <h1 class="mb-3">Customer Questionnaire</h1>
  <p class="text-muted">
    Please answer the questions below to help us improve CleanLink.
  </p>

  <div id="questionnaireAlert" class="alert d-none"></div>

  <form id="questionnaireForm" class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="qName">Name</label>
      <input type="text" id="qName" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label" for="qEmail">Email</label>
      <input type="email" id="qEmail" class="form-control">
    </div>

    <div class="col-12">
      <label class="form-label d-block">How satisfied are you with the booking process?</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="qRating" id="rate1" value="1">
        <label class="form-check-label" for="rate1">1</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="qRating" id="rate2" value="2">
        <label class="form-check-label" for="rate2">2</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="qRating" id="rate3" value="3">
        <label class="form-check-label" for="rate3">3</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="qRating" id="rate4" value="4">
        <label class="form-check-label" for="rate4">4</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="qRating" id="rate5" value="5">
        <label class="form-check-label" for="rate5">5</label>
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="qServiceType">Which service did you use?</label>
      <select id="qServiceType" class="form-select">
        <option value="">Choose...</option>
        <option>Car Wash</option>
        <option>Laundry</option>
        <option>Home Cleaning</option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="qRecommend">Would you recommend CleanLink?</label>
      <select id="qRecommend" class="form-select">
        <option value="">Choose...</option>
        <option>Yes</option>
        <option>No</option>
        <option>Maybe</option>
      </select>
    </div>

    <div class="col-12">
      <label class="form-label" for="qComments">Any comments or suggestions?</label>
      <textarea id="qComments" rows="3" class="form-control"></textarea>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit Questionnaire</button>
    </div>
  </form>
