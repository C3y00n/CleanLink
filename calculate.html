<main class="container my-4">
  <h1 class="mb-3">Estimate Your Cleaning Cost</h1>
  <p class="text-muted">Use this simple calculator to estimate the total cost for your booking.</p>

  <form id="calcForm" class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="calcService">Service Type</label>
      <select id="calcService" class="form-select" required>
        <option value="car">Car Wash (base 7 OMR)</option>
        <option value="laundry">Laundry (base 5 OMR)</option>
        <option value="home">Home Cleaning (base 12 OMR)</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="calcQuantity">Quantity / Units</label>
      <input id="calcQuantity" type="number" min="1" value="1"
             class="form-control" required>
    </div>
    <div class="col-md-6">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="calcUrgent">
        <label class="form-check-label" for="calcUrgent">
          Urgent service (20% extra)
        </label>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="calcDiscount">
        <label class="form-check-label" for="calcDiscount">
          Loyal customer (15% discount)
        </label>
      </div>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Calculate</button>
    </div>
  </form>

  <div class="alert alert-info mt-3" id="calcResult">
    Estimated total: -
  </div>
